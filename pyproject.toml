[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "twinage"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.11.1",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.140.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
]

[tool.hatch.version]
source = "vcs"
